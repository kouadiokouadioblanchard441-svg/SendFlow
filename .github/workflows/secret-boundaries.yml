name: Secret boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-boundaries:
    name: Check secrets and security tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Scan repository for secrets
        run: node scripts/security/check-secrets.mjs

      - name: Run standalone security tests
        run: node --test scripts/security/*.test.mjs
