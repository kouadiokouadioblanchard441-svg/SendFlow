name: Secret boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-boundaries:
    name: Check secrets and security tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan repository for secrets
        run: node scripts/security/check-secrets.mjs

      - name: Run standalone security tests
        run: node --test scripts/security/*.test.mjs

      - name: Build and scan public web assets
        run: pnpm --filter @workspace/sendflow run build:capacitor
