kind = "mobile"
previewPath = "/sendflow-mobile/"
title = "SendFlow Mobile"
description = "Application mobile SendFlow pour les transferts internationaux, les transferts inter réseau, l'historique et les cartes cadeau."
version = "1.0.0"
id = "artifacts/sendflow-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/sendflow-mobile/" ]
localPort = 24928

[services.development]
run = "pnpm --filter @workspace/sendflow-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sendflow-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sendflow-mobile", "run", "serve" ]

[services.env]
PORT = "24928"
BASE_PATH = "/sendflow-mobile/"
