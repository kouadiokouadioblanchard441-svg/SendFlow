kind = "web"
previewPath = "/"
title = "SendFlow"
description = "A mobile-first SendFlow application with secure account access and country-aware phone authentication."
version = "1.0.0"
id = "artifacts/sendflow"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26095

[services.development]
run = "pnpm --filter @workspace/sendflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sendflow", "run", "build" ]
serve = "static"
publicDir = "artifacts/sendflow/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26095"
BASE_PATH = "/"
