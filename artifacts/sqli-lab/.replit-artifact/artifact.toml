kind = "web"
previewPath = "/sqli-lab/"
title = "SQLi Lab"
description = "Laboratoire pédagogique local pour comprendre les injections SQL et comparer les requêtes vulnérables et préparées en PHP natif."
version = "1.0.0"
id = "artifacts/sqli-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/sqli-lab/" ]
localPort = 19663

[services.development]
run = "pnpm --filter @workspace/sqli-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sqli-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/sqli-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19663"
BASE_PATH = "/sqli-lab/"
