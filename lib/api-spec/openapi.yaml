                $ref: "#/components/schemas/ErrorEnvelope"
  /me/payment-links/simulate/{token}:
    post:
      operationId: simulateCustomerPaymentLink
      tags: [account]
      summary: Simulate a payment-link success for the Replit viewer without charging or creating a financial record
      description: Available only to the authorized preview viewer in the restricted shared-database preview. This operation does not contact a provider, persist a payment attempt, or change a balance or transaction.
      security:
        - sendFlowSession: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPaymentLinkSimulationInput"
      responses:
        "200":
          description: Server-derived simulation result; no real payment occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatedPaymentLinkSuccess"
        "401":
          description: Authentication is required.
        "403":
          description: Only the authorized Replit viewer can use simulation.
        "404":
          description: The link does not exist or does not belong to the viewer.
        "429":
          description: The simulation request limit was exceeded.
        "503":
          description: Link storage or simulation access is unavailable.
  /public/payment-links/{token}:
