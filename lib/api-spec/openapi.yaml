openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Public object storage serving.
  - name: account
    description: Authenticated account operations.
  - name: database
    description: Development database diagnostics.
  - name: identity-verification
    description: Didit identity verification for development and sandbox testing.
  - name: admin
    description: Protected SendFlow back-office read operations.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public object
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative path within the configured public object search paths.
      responses:
        "200":
          description: Public object content.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Storage service failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /db-status:
    get:
      operationId: databaseHealthCheck
      tags: [database]
      summary: Check database connectivity
      description: Checks connectivity to the configured development database without exposing credentials or database details.
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
        "503":
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me:
    get:
      operationId: getCurrentAccount
      tags: [account]
      summary: Get the authenticated SendFlow account
      responses:
        "200":
          description: Current account and wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/identity-verification:
    get:
      operationId: getIdentityVerificationStatus
      tags: [identity-verification]
      summary: Get the current identity verification status
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current verification status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationStatusResult"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Verification storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createIdentityVerificationSession
      tags: [identity-verification]
      summary: Create a Didit verification session
      description: Creates a development or sandbox verification session. Didit credentials remain server-side.
      security:
        - clerkSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityVerificationSessionRequest"
      responses:
        "201":
          description: Verification session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationSessionResult"
        "200":
          description: Existing in-progress session reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationSessionResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Didit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Didit development credentials are not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /webhooks/didit:
    post:
      operationId: receiveDiditWebhook
      tags: [identity-verification]
      summary: Receive a signed Didit webhook
      description: Verifies X-Signature-V2 before applying an idempotent status update.
      parameters:
        - name: X-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Unix timestamp sent by Didit. Requests older than five minutes are rejected.
        - name: X-Signature-V2
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of Didit's canonical JSON payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiditWebhookPayload"
      responses:
        "200":
          description: Webhook accepted or recognized as a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReceipt"
        "400":
          description: Invalid webhook payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid webhook signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Webhook processing is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get the SendFlow administration overview
      description: Returns server-calculated platform metrics for an authorized administrator.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminFrom"
        - $ref: "#/components/parameters/AdminTo"
      responses:
        "200":
          description: Administration overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /banners:
    get:
      operationId: listPublishedBanners
      tags: [account]
      summary: List banners currently visible to customers
      description: Returns active banners within their optional publication dates, in configured display order.
      responses:
        "200":
          description: Published banners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBannerList"
        "503":
          description: Banner storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/banners:
    get:
      operationId: listAdminBanners
      tags: [admin]
      summary: List all banners for administrators
      security:
        - clerkSession: []
      responses:
        "200":
          description: All banners, including inactive and scheduled entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBannerList"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAdminBanner
      tags: [admin]
      summary: Create a banner
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerInput"
      responses:
        "201":
          description: Banner created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBanner"
        "400":
          description: Invalid banner data or publication period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Mutation access is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/otp-policies:
    get:
      operationId: listAdminOtpPolicies
      tags: [admin]
      summary: List Orange Money OTP policies for supported countries
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current policy values and official API connection status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOtpPolicyList"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/otp-policies/{countryCode}/{operatorId}:
    parameters:
      - $ref: "#/components/parameters/AdminOtpPolicyCountryCode"
      - $ref: "#/components/parameters/AdminOtpPolicyOperatorId"
    patch:
      operationId: updateAdminOtpPolicy
      tags: [admin]
      summary: Update whether OTP is required for a supported Orange Money operator
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOtpPolicyUpdate"
      responses:
        "200":
          description: The updated OTP policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOtpPolicy"
        "400":
          description: Invalid policy values or audit reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Mutation access is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The country and operator combination is not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Policy changed since it was loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/banners/reorder:
    patch:
      operationId: reorderAdminBanners
      tags: [admin]
      summary: Reorder all administrator banners atomically
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBannerReorderRequest"
      responses:
        "200":
          description: Banners in the updated display order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBannerList"
        "400":
          description: Invalid or incomplete banner order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Mutation access is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Banner order changed since it was loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/banners/{bannerId}:
    parameters:
      - $ref: "#/components/parameters/AdminBannerId"
    patch:
      operationId: updateAdminBanner
      tags: [admin]
      summary: Update a banner
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerUpdate"
      responses:
        "200":
          description: Banner updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBanner"
        "400":
          description: Invalid banner data or publication period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Mutation access is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Banner not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteAdminBanner
      tags: [admin]
      summary: Delete a banner
      security:
        - clerkSession: []
      responses:
        "200":
          description: Banner deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAdminBannerResult"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Mutation access is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Banner not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/login-activity:
    get:
      operationId: listAdminLoginActivity
      tags: [admin]
      summary: List authenticated user sessions
      description: Returns server-recorded session starts with network and device metadata for an authorized administrator.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminSearch"
        - $ref: "#/components/parameters/AdminUserIdFilter"
        - $ref: "#/components/parameters/AdminFrom"
        - $ref: "#/components/parameters/AdminTo"
        - $ref: "#/components/parameters/AdminPage"
        - $ref: "#/components/parameters/AdminPageSize"
      responses:
        "200":
          description: Paginated login activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginActivityPage"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List SendFlow users for administrators
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminSearch"
        - $ref: "#/components/parameters/AdminPage"
        - $ref: "#/components/parameters/AdminPageSize"
      responses:
        "200":
          description: Paginated users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get a SendFlow user detail for administrators
      description: Returns the persisted profile, wallet, and transaction summary for an authorized administrator. Use the administrator transaction list with userId to retrieve the paginated operations.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      responses:
        "200":
          description: User detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "400":
          description: Invalid user identifier or pagination filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: List SendFlow transactions for administrators
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminSearch"
        - $ref: "#/components/parameters/AdminUserIdFilter"
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [inter-network, deposit, international]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, succeeded, failed]
        - $ref: "#/components/parameters/AdminFrom"
        - $ref: "#/components/parameters/AdminTo"
        - $ref: "#/components/parameters/AdminPage"
        - $ref: "#/components/parameters/AdminPageSize"
      responses:
        "200":
          description: Paginated transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransactionPage"
        "400":
          description: Invalid transaction filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/transactions/{transactionId}:
    get:
      operationId: getAdminTransaction
      tags: [admin]
      summary: Get a SendFlow transaction detail for administrators
      description: Returns the persisted transaction endpoints, user, operators, references, amounts, fees, and status for an authorized administrator.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminTransactionId"
      responses:
        "200":
          description: Transaction detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransactionDetail"
        "400":
          description: Invalid transaction identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Transaction not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users/{userId}/wallet-adjustments:
    post:
      operationId: createAdminWalletAdjustment
      tags: [admin]
      summary: Create an audited wallet credit or debit
      description: Adjusts a wallet through an immutable ledger entry. Direct balance overwrites are not supported.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWalletAdjustmentRequest"
      responses:
        "201":
          description: Wallet adjustment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletAdjustmentResult"
        "200":
          description: Idempotent retry of an existing wallet adjustment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletAdjustmentResult"
        "400":
          description: Invalid adjustment or insufficient wallet balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Financial administrator access is denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User or wallet not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Wallet changed since it was displayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Financial administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users/{userId}/suspend:
    post:
      operationId: suspendAdminUser
      tags: [admin]
      summary: Suspend a SendFlow user with an audit trail
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserActionRequest"
      responses:
        "200":
          description: User suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "400":
          description: Invalid action or user is already deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Mutation administrator access is denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Mutation administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users/{userId}/restore:
    post:
      operationId: restoreAdminUser
      tags: [admin]
      summary: Restore a suspended SendFlow user with an audit trail
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserActionRequest"
      responses:
        "200":
          description: User restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "400":
          description: Invalid action or user is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Mutation administrator access is denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Mutation administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users/{userId}/delete:
    post:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Soft-delete a SendFlow user with an audit trail
      description: Retains financial records and anonymizes no data automatically. This is reversible only through a documented recovery process.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserActionRequest"
      responses:
        "200":
          description: User soft-deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "400":
          description: Invalid action or user is already deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Mutation administrator access is denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Mutation administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/transactions/{transactionId}/archive:
    post:
      operationId: archiveAdminTransaction
      tags: [admin]
      summary: Archive a transaction without deleting its financial record
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminTransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserActionRequest"
      responses:
        "200":
          description: Transaction archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "400":
          description: Invalid action or transaction already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Mutation administrator access is denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Transaction not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Mutation administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    AdminFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive UTC calendar date.
    AdminTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive UTC calendar date.
    AdminSearch:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    AdminPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    AdminPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    AdminUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AdminUserIdFilter:
      name: userId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    AdminTransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminOtpPolicyCountryCode:
      name: countryCode
      in: path
      required: true
      schema:
        type: string
        enum: [ci, bf, ml, sn]
    AdminOtpPolicyOperatorId:
      name: operatorId
      in: path
      required: true
      schema:
        type: string
        enum: [orange-ci, orange-bf, orange-ml, orange-sn]
    AdminBannerId:
      name: bannerId
      in: path
      required: true
      schema:
