openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Public object storage serving.
  - name: account
    description: Authenticated account operations.
  - name: database
    description: Development database diagnostics.
  - name: identity-verification
    description: Account-limit identity verification status.
  - name: authentication
    description: Email verification for signup and account recovery. It does not prove ownership of the account phone number.
  - name: admin
    description: Protected SendFlow back-office read operations.
  - name: pricing
    description: Public operator availability and customer pricing.
  - name: payment-links
    description: Owner-managed payment links and their public payment pages.
  - name: developer
    description: Merchant API credentials, payment sessions and webhook endpoints.
paths:
  /DMgrgmt-1np5g23g12bGFtMwh/network-defense:
    get:
      operationId: getAdminNetworkDefense
      tags: [admin]
      summary: Read automatic blocks and explicitly trusted IPs
      responses:
        "200":
          description: Server-owned defense state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkDefenseStatus"
        "503":
          description: Administrator access or storage unavailable
  /DMgrgmt-1np5g23g12bGFtMwh/network-defense/exceptions:
    post:
      operationId: createAdminNetworkException
      tags: [admin]
      summary: Exempt one IP from automatic detection only, never manual bans or authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpBlockInput"
      responses:
        "201":
          description: Exception recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkException"
        "409":
          description: Already trusted or manually blocked
  /DMgrgmt-1np5g23g12bGFtMwh/network-defense/authorize-and-release:
    post:
      operationId: authorizeAndReleaseNetworkIp
      tags: [admin]
      summary: Explicitly trust one IP and atomically release its manual and automatic bans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpBlockInput"
      responses:
        "200":
          description: IP is trusted and all current application bans were released atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIpAuthorizationResult"
        "400":
          description: Invalid public IPv4/IPv6 address or reason
        "409":
          description: IP cannot be authorized or release operation conflicted
  /DMgrgmt-1np5g23g12bGFtMwh/network-defense/exceptions/{id}/revoke:
    post:
      operationId: revokeAdminNetworkException
      tags: [admin]
      summary: Revoke a trusted IP using its current version
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpBlockRevocation"
      responses:
        "200":
          description: Exception revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkException"
        "409":
          description: Stale version or already revoked
  /DMgrgmt-1np5g23g12bGFtMwh/network-defense/blocks/{id}/release:
    post:
      operationId: releaseAdminAutomaticBlock
      tags: [admin]
      summary: Release an automatic block without changing any manual ban
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpBlockRevocation"
      responses:
        "200":
          description: Automatic block released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomaticIpBlock"
        "409":
          description: Stale version or no active block
  /DMgrgmt-1np5g23g12bGFtMwh/ip-blocklist:
    get:
      operationId: listAdminIpBlocks
      tags: [admin]
      summary: List IP blocks with administrative authorization
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        "200":
          description: Persistent blocklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBlockList"
        "503":
          description: Administrator access or storage unavailable
    post:
      operationId: createAdminIpBlock
      tags: [admin]
      summary: Permanently block one IP until audited revocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpBlockInput"
      responses:
        "201":
          description: IP blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBlock"
        "400":
          description: Invalid IP or reason
        "409":
          description: Already blocked or self-block rejected
        "503":
          description: Administrator access or storage unavailable
  /DMgrgmt-1np5g23g12bGFtMwh/ip-blocklist/{id}/revoke:
    post:
      operationId: revokeAdminIpBlock
      tags: [admin]
      summary: Revoke an IP block with optimistic concurrency and audit
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpBlockRevocation"
      responses:
        "200":
          description: Block revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBlock"
        "409":
          description: Block changed or already revoked
        "503":
          description: Administrator access or storage unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/send-otp:
    post:
      operationId: sendEmailOtp
      tags: [authentication]
      summary: Send an email verification code
      description: Creates a short-lived verification challenge and sends its code to the signup email or the email associated with the account. The sender configuration and API credential stay on the server. A verified email does not prove ownership of the account phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpSendInput"
      responses:
        "202":
          description: A verification challenge was accepted. For recovery or administrator access, the response does not reveal whether a matching account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpSendResult"
        "400":
          description: Invalid request or missing signup email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Untrusted request origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Phone, email or requester has reached an OTP send limit, or signup is temporarily locked after failed attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRateLimitError"
        "502":
          description: Email delivery is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: OTP storage or provider configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/verify-otp:
    post:
      operationId: verifyEmailOtp
      tags: [authentication]
      summary: Verify an email code
      description: Checks the one-time code stored by SendFlow and persists email verification for the declared purpose. It never marks the account phone as verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpVerifyInput"
      responses:
        "200":
          description: The email code was verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpVerifyResult"
        "400":
          description: Invalid request or code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Untrusted request origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Verification expired, was already used, or exceeded its attempt limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Signup verification is temporarily rate-limited after failed attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRateLimitError"
        "503":
          description: OTP storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/countries:
    get:
      operationId: getAuthCountries
      tags: [auth]
      summary: List configured countries and server-defined phone rules
      responses:
        "200":
          description: Public country catalog. Registration availability is informational only; the server validates it again when creating an account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryCatalog"
        "503":
          description: Country catalog is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/registration-settings:
    get:
      operationId: getRegistrationSettings
      tags: [account]
      summary: Read whether email verification is required for signup
      responses:
        "200":
          description: Current signup verification requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRegistrationSettings"
        "503":
          description: Registration settings could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /customer-service-settings:
    get:
      operationId: getCustomerServiceSettings
      tags: [account]
      summary: Read the currently active SendFlow customer-service contacts
      responses:
        "200":
          description: Public support contact settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCustomerServiceSettings"
        "503":
          description: Contact settings are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/register:
    post:
      operationId: registerCustomer
      tags: [account]
      summary: Create a customer account under the current verification policy
      description: Consumes a verified email challenge when email verification is enabled; otherwise records the email as unverified. The phone remains unverified in either case. Creates the account, wallet, initial public/secret developer API key pair, and customer session. The secret is returned only in this creation response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegistrationInput"
      responses:
        "201":
          description: Account created and session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResult"
        "400":
          description: Invalid profile, password, or privacy acceptance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The verification is invalid or the phone or email is already associated with an account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many invalid sign-up attempts; retryAfterSeconds gives the remaining lockout time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRateLimitError"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/sign-in:
    post:
      operationId: signInCustomer
      tags: [account]
      summary: Sign in to a SendFlow customer account
      description: Validates the email address and password and issues a secure customer session cookie. Phone numbers remain available for other account and payment flows but are not accepted as the sign-in identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSignInInput"
      responses:
        "200":
          description: Credentials accepted and session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Email address or password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "423":
          description: The credentials are valid, but the account is blocked. Contact SendFlow support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Three failed sign-in attempts lock the email identifier and requester for 20 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRateLimitError"
        "503":
          description: Account storage or session configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/session:
    get:
      operationId: getCustomerSession
      tags: [account]
      summary: Get the current SendFlow customer session
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Current customer session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionResult"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/sign-out:
    post:
      operationId: signOutCustomer
      tags: [account]
      summary: Revoke the current SendFlow customer session
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Session revoked and cookie cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMutationResult"
        "403":
          description: Untrusted request origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/reset-password:
    post:
      operationId: resetCustomerPassword
      tags: [account]
      summary: Reset a customer password using a verified email code
      description: Requires a single-use password-recovery code sent to the verified email address on the account. The response does not reveal whether the email belongs to an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPasswordResetInput"
      responses:
        "200":
          description: Recovery request processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMutationResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The recovery verification is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/reset-pin:
    post:
      operationId: resetCustomerPin
      tags: [account]
      summary: Reset a customer PIN using a verified phone code
      description: Requires a single-use PIN-recovery OTP. Existing sessions are revoked and the response does not reveal whether the phone has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPinResetInput"
      responses:
        "200":
          description: Recovery request processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMutationResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The recovery verification is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/unlock:
    post:
      operationId: unlockCustomerSession
      tags: [account]
      summary: Verify the customer PIN for the current session
      security:
        - sendFlowSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPinUnlockInput"
      responses:
        "200":
          description: PIN accepted; the session is temporarily unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPinStateResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: PIN is incorrect or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many PIN attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRateLimitError"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/biometric:
    get:
      operationId: getCustomerBiometricStatus
      tags: [account]
      summary: Check biometric unlock availability for the current customer
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Biometric credential status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerBiometricStatus"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: removeCustomerBiometricCredentials
      tags: [account]
      summary: Remove biometric credentials from the current customer account
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Biometric credentials removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerBiometricStatus"
        "403":
          description: The customer PIN must be unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/biometric/registration/options:
    post:
      operationId: startCustomerBiometricRegistration
      tags: [account]
      summary: Start secure biometric credential registration
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Registration options for the current device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerBiometricOptions"
        "403":
          description: The customer PIN must be unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/biometric/registration/verify:
    post:
      operationId: verifyCustomerBiometricRegistration
      tags: [account]
      summary: Verify and save a biometric credential
      security:
        - sendFlowSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerBiometricVerificationInput"
      responses:
        "200":
          description: Biometric credential registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerBiometricStatus"
        "400":
          description: Invalid or expired registration challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/biometric/authentication/options:
    post:
      operationId: startCustomerBiometricAuthentication
      tags: [account]
      summary: Start biometric authentication for the current session
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Authentication options for registered credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerBiometricOptions"
        "404":
          description: No biometric credential is registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/biometric/authentication/verify:
    post:
      operationId: verifyCustomerBiometricAuthentication
      tags: [account]
      summary: Verify biometric authentication and unlock the current PIN session
      security:
        - sendFlowSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerBiometricVerificationInput"
      responses:
        "200":
          description: Biometric proof accepted; the current session is temporarily unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPinStateResult"
        "401":
          description: Biometric proof is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many authentication attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRateLimitError"
  /me/pin:
    put:
      operationId: setCustomerPin
      tags: [account]
      summary: Set or change the customer PIN
      description: First-time setup needs an authenticated session; changing an existing PIN also requires the current PIN.
      security:
        - sendFlowSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPinSetInput"
      responses:
        "200":
          description: PIN saved and the current session temporarily unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPinStateResult"
        "400":
          description: Invalid PIN or current PIN required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required or the current PIN is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many PIN attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRateLimitError"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public object
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative path within the configured public object search paths.
      responses:
        "200":
          description: Public object content.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Storage service failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /db-status:
    get:
      operationId: databaseHealthCheck
      tags: [database]
      summary: Check database connectivity
      description: Checks connectivity to the configured development database without exposing credentials or database details.
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
        "503":
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me:
    get:
      operationId: getCurrentAccount
      tags: [account]
      summary: Get the authenticated SendFlow account
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Current account and wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/portal-eligibility:
    get:
      operationId: getCustomerPortalEligibility
      tags: [account]
      summary: Check whether the authenticated account has an active administrator grant
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: The authenticated account has an active grant and may enter the protected sign-in flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPortalEligibilityResult"
        "404":
          description: The authenticated account has no active grant; the protected route is not available.
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Authorization state is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/profile:
    get:
      operationId: getCustomerProfile
      tags: [account]
