openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Public object storage serving.
  - name: account
    description: Authenticated account operations.
  - name: database
    description: Development database diagnostics.
  - name: identity-verification
    description: Didit identity verification for development and sandbox testing.
  - name: phone-verification
    description: Public signup phone verification through eSMS Africa.
  - name: admin
    description: Protected SendFlow back-office read operations.
  - name: pricing
    description: Public operator availability and customer pricing.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/send-otp:
    post:
      operationId: sendPhoneOtp
      tags: [phone-verification]
      summary: Send a phone verification code
      description: Starts an eSMS Africa Verify request for signup or account recovery. Provider credentials stay on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpSendInput"
      responses:
        "202":
          description: Verification code sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpSendResult"
        "400":
          description: Invalid phone number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Untrusted request origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Phone or requester has reached an OTP send limit, or signup is temporarily locked after three failed attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpRateLimitError"
        "502":
          description: eSMS Africa Verify is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: OTP storage or provider configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/verify-otp:
    post:
      operationId: verifyPhoneOtp
      tags: [phone-verification]
      summary: Check a phone verification code
      description: Checks the code with eSMS Africa and persists the verified phone state for its declared purpose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpVerifyInput"
      responses:
        "200":
          description: The provider approved the verification code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpVerifyResult"
        "400":
          description: Invalid request or code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Untrusted request origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Verification expired, was already used, or exceeded its attempt limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: The OTP provider has limited verification checks, or signup is locked after three failed attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpRateLimitError"
        "502":
          description: eSMS Africa Verify is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: OTP storage or provider configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/registration-settings:
    get:
      operationId: getRegistrationSettings
      tags: [account]
      summary: Check whether phone SMS verification is required for signup
      responses:
        "200":
          description: Current signup verification requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRegistrationSettings"
        "503":
          description: Registration settings could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/register:
    post:
      operationId: registerCustomer
      tags: [account]
      summary: Create a customer account under the current verification policy
      description: Consumes a verified signup challenge when SMS verification is enabled; otherwise records the phone as unverified. Creates the account and wallet and starts a customer session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegistrationInput"
      responses:
        "201":
          description: Account created and session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResult"
        "400":
          description: Invalid profile, password, or privacy acceptance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The verification is invalid or the phone already has an account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many invalid sign-up attempts; retryAfterSeconds gives the remaining lockout time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpRateLimitError"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/sign-in:
    post:
      operationId: signInCustomer
      tags: [account]
      summary: Sign in to a SendFlow customer account
      description: Validates the phone and password and issues a secure customer session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSignInInput"
      responses:
        "200":
          description: Credentials accepted and session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Phone or password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Three failed sign-in attempts lock the phone and requester for 20 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpRateLimitError"
        "503":
          description: Account storage or session configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/session:
    get:
      operationId: getCustomerSession
      tags: [account]
      summary: Get the current SendFlow customer session
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Current customer session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionResult"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/sign-out:
    post:
      operationId: signOutCustomer
      tags: [account]
      summary: Revoke the current SendFlow customer session
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Session revoked and cookie cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMutationResult"
        "403":
          description: Untrusted request origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/reset-password:
    post:
      operationId: resetCustomerPassword
      tags: [account]
      summary: Reset a customer password using a verified phone code
      description: Requires a single-use password-recovery OTP. The response does not reveal whether the phone has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPasswordResetInput"
      responses:
        "200":
          description: Recovery request processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMutationResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The recovery verification is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/reset-pin:
    post:
      operationId: resetCustomerPin
      tags: [account]
      summary: Reset a customer PIN using a verified phone code
      description: Requires a single-use PIN-recovery OTP. Existing sessions are revoked and the response does not reveal whether the phone has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPinResetInput"
      responses:
        "200":
          description: Recovery request processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMutationResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The recovery verification is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/unlock:
    post:
      operationId: unlockCustomerSession
      tags: [account]
      summary: Verify the customer PIN for the current session
      security:
        - sendFlowSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPinUnlockInput"
      responses:
        "200":
          description: PIN accepted; the session is temporarily unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPinStateResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: PIN is incorrect or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many PIN attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpRateLimitError"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/pin:
    put:
      operationId: setCustomerPin
      tags: [account]
      summary: Set or change the customer PIN
      description: First-time setup needs an authenticated session; changing an existing PIN also requires the current PIN.
      security:
        - sendFlowSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPinSetInput"
      responses:
        "200":
          description: PIN saved and the current session temporarily unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPinStateResult"
        "400":
          description: Invalid PIN or current PIN required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required or the current PIN is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many PIN attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpRateLimitError"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public object
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative path within the configured public object search paths.
      responses:
        "200":
          description: Public object content.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Storage service failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /db-status:
    get:
      operationId: databaseHealthCheck
      tags: [database]
      summary: Check database connectivity
      description: Checks connectivity to the configured development database without exposing credentials or database details.
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
        "503":
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me:
    get:
      operationId: getCurrentAccount
      tags: [account]
      summary: Get the authenticated SendFlow account
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Current account and wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Account storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/account-limit:
    get:
      operationId: getCurrentAccountLimit
      tags: [account]
      summary: Get the authenticated account's monthly transfer limit
      description: Returns the server-calculated monthly limit and the user's pending or successful outgoing transfer usage for the current calendar month.
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Current monthly account limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLimitResult"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Account limit data is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/transactions:
    get:
      operationId: getCustomerTransactions
      tags: [account]
      summary: List the authenticated customer's transactions
      description: Returns one page of the current customer's transactions, newest first. Search matches phone numbers and references across all records. Use nextCursor to load older records.
      security:
        - sendFlowSession: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: limit
          in: query
          required: false
          description: Number of records in this page. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: A page of customer-owned transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTransactionPage"
        "400":
          description: The cursor is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Transaction history is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/transactions/{transactionId}:
    get:
      operationId: getCustomerTransaction
      tags: [account]
      summary: Get one transaction owned by the authenticated customer
      security:
        - sendFlowSession: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested customer-owned transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTransaction"
        "400":
          description: The transaction identifier is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The transaction does not exist for this customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Transaction details are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/identity-verification:
    get:
      operationId: getIdentityVerificationStatus
      tags: [identity-verification]
      summary: Get the current identity verification status
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Current verification status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationStatusResult"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Verification storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createIdentityVerificationSession
      tags: [identity-verification]
      summary: Create a Didit verification session
      description: Creates a development or sandbox verification session. Didit credentials remain server-side.
      security:
        - sendFlowSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityVerificationSessionRequest"
      responses:
        "201":
          description: Verification session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationSessionResult"
        "200":
          description: Existing in-progress session reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationSessionResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: The user has reached the rolling Didit session attempt limit.
          headers:
            Retry-After:
              description: Seconds until the oldest counted attempt expires.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Didit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Didit development credentials are not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /webhooks/didit:
    post:
      operationId: receiveDiditWebhook
      tags: [identity-verification]
      summary: Receive a signed Didit webhook
      description: Verifies X-Signature-V2 before applying an idempotent status update.
      parameters:
        - name: X-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Unix timestamp sent by Didit. Requests older than five minutes are rejected.
        - name: X-Signature-V2
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of Didit's canonical JSON payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiditWebhookPayload"
      responses:
        "200":
          description: Webhook accepted or recognized as a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReceipt"
        "400":
          description: Invalid webhook payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Event identifier conflicts with a previously received event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid webhook signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Webhook processing is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /DMgrgmt-1np5g23g12bGFtMwh/access:
    get:
      operationId: getAdminAccessStatus
      tags: [admin]
      summary: Check administrator access status
      description: Returns whether the signed-in Clerk user is authorized and whether the administrator PIN session is active.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Administrator access status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessStatus"
  /DMgrgmt-1np5g23g12bGFtMwh/pin/unlock:
    post:
      operationId: unlockAdminPin
      tags: [admin]
      summary: Unlock the administrator panel with a PIN
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPinInput"
      responses:
        "200":
          description: Administrator PIN accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPinUnlockResponse"
        "400":
          description: The PIN format is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator or the PIN is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many incorrect PIN attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator PIN access is not configured or rate-limit storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /DMgrgmt-1np5g23g12bGFtMwh/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get the SendFlow administration overview
      description: Returns server-calculated platform metrics for an authorized administrator.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminFrom"
        - $ref: "#/components/parameters/AdminTo"
      responses:
        "200":
          description: Administration overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The authenticated user is not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Administrator access is not configured or storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /pricing:
    get:
      operationId: getPublicPricing
      tags: [pricing]
      summary: Get active operators and public pricing
      description: Returns enabled operators and configured rates for each pricing section. Unconfigured rates are omitted.
      responses:
        "200":
          description: Public pricing catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPricingCatalog"
        "503":
          description: Pricing catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /banners:
    get:
      operationId: listPublishedBanners
      tags: [account]
      summary: List banners currently visible to customers
      description: Returns active banners within their optional publication dates, in configured display order.
      responses:
        "200":
          description: Published banners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBannerList"
        "503":
          description: Banner storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
