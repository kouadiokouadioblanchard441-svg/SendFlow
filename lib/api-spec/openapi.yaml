          description: Wallet adjustment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletAdjustmentResult"
        "200":
          description: Idempotent retry of an existing wallet adjustment.
          content:
            application/json:
              schema:
