            pattern: "^[A-Za-z0-9_-]{43}$"
        - name: countryCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z]{2}$"
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 60
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPaymentLinkQuoteInput"
      responses:
        "200":
          description: Server-calculated amount, fee, and payer total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentLinkQuote"
        "400":
          description: The selected country or operator is not currently available for this link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The link is unavailable, inactive, expired, or exhausted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Public quote rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Quote data is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/payment-links/{linkId}/image:
    post:
      operationId: uploadCustomerPaymentLinkImage
      tags: [account]
      summary: Store an image on an owned draft payment link
      description: Requires a verified customer PIN, server-side CSRF validation, an owned draft, and a PNG, JPEG, GIF, or WebP upload no larger than 5 MiB. The server validates and re-encodes the file as WebP; it is stored as inert image data and is not executed.
      security:
        - sendFlowSession: []
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: The normalized WebP image was stored on the draft.
        "400":
          description: The image bytes are malformed or do not match their declared image type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: PIN verification or preview account permission is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The link does not belong to the authenticated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Only a draft link can receive an image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The upload exceeds the 5 MiB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: The declared content type is not an accepted image type or the request is compressed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: The upload rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Image storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
