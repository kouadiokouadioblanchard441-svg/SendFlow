components:
  parameters:
    AdminFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive UTC calendar date.
    AdminTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive UTC calendar date.
    AdminSearch:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    AdminPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    AdminPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    AdminUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AdminUserIdFilter:
      name: userId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    AdminTransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminOtpPolicyCountryCode:
      name: countryCode
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 2
        pattern: "^[a-z]{2}$"
    AdminOtpPolicyOperatorId:
      name: operatorId
      in: path
      required: true
      schema:
        type: string
        minLength: 9
        maxLength: 9
        pattern: "^orange-[a-z]{2}$"
    AdminBannerId:
      name: bannerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminOperatorId:
      name: operatorId
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 60
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sendFlowSession:
      type: apiKey
      in: cookie
      name: __Host-sendflow_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    PhoneOtpSendInput:
      type: object
      properties:
        phone:
          type: string
          format: phone
          minLength: 9
          maxLength: 16
          pattern: "^\\+[1-9][0-9]{7,14}$"
        purpose:
          type: string
          enum: [signup, password_reset, pin_reset]
      required: [phone, purpose]
    PhoneOtpSendResult:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        resendAfterSeconds:
          type: integer
          minimum: 0
      required: [challengeId, expiresAt, resendAfterSeconds]
    PhoneOtpVerifyInput:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [signup, password_reset, pin_reset]
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
      required: [challengeId, purpose, code]
    PhoneOtpVerifyResult:
      type: object
      properties:
        phoneVerified:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
      required: [phoneVerified, verifiedAt]
    PhoneOtpRateLimitError:
      type: object
      properties:
        error:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
      required: [error, retryAfterSeconds]
    PublicRegistrationSettings:
      type: object
      properties:
        smsVerificationEnabled:
          type: boolean
      required: [smsVerificationEnabled]
    AdminRegistrationSettings:
      type: object
      properties:
        smsVerificationEnabled:
          type: boolean
        version:
          type: integer
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required: [smsVerificationEnabled, version, updatedAt]
    RegistrationSettingsUpdate:
      type: object
      properties:
        smsVerificationEnabled:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500
      required: [smsVerificationEnabled, expectedVersion, reason]
    CustomerRegistrationInput:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        phone:
          type: string
          format: phone
          minLength: 9
          maxLength: 16
          pattern: "^\\+[1-9][0-9]{7,14}$"
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        birthDate:
          type: string
          format: date
        countryCode:
          type: string
          pattern: "^[A-Z]{2}$"
        password:
          type: string
          minLength: 8
          maxLength: 64
        acceptedPrivacy:
          type: boolean
      required: [phone, fullName, birthDate, password, acceptedPrivacy]
    CustomerSignInInput:
      type: object
      properties:
        phone:
          type: string
          format: phone
          minLength: 9
          maxLength: 16
          pattern: "^\\+[1-9][0-9]{7,14}$"
        password:
          type: string
          minLength: 4
          maxLength: 64
      required: [phone, password]
    CustomerPasswordResetInput:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        phone:
          type: string
          format: phone
          minLength: 9
          maxLength: 16
          pattern: "^\\+[1-9][0-9]{7,14}$"
        newPassword:
          type: string
          minLength: 8
          maxLength: 64
      required: [challengeId, phone, newPassword]
    CustomerPinResetInput:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        phone:
          type: string
          format: phone
          minLength: 9
          maxLength: 16
          pattern: "^\\+[1-9][0-9]{7,14}$"
        newPin:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[0-9]{4}$"
      required: [challengeId, phone, newPin]
    CustomerPinUnlockInput:
      type: object
      properties:
        pin:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[0-9]{4}$"
      required: [pin]
    CustomerPinSetInput:
      type: object
      properties:
        currentPin:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[0-9]{4}$"
        newPin:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[0-9]{4}$"
      required: [newPin]
    CustomerAuthResult:
      type: object
      properties:
        userId:
          type: string
        phone:
          type: string
        displayName:
          type: ["string", "null"]
        countryCode:
          type: ["string", "null"]
        pinConfigured:
          type: boolean
      required: [userId, phone, displayName, countryCode, pinConfigured]
    CustomerSessionResult:
      type: object
      properties:
        userId:
          type: string
        phone:
          type: string
        displayName:
          type: ["string", "null"]
        countryCode:
          type: ["string", "null"]
        pinConfigured:
          type: boolean
        pinUnlocked:
          type: boolean
      required: [userId, phone, displayName, countryCode, pinConfigured, pinUnlocked]
    CustomerPinStateResult:
      type: object
      properties:
        pinConfigured:
          type: boolean
        pinUnlocked:
          type: boolean
      required: [pinConfigured, pinUnlocked]
    CustomerMutationResult:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    DatabaseStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy]
      required:
        - status
    WalletSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currency:
          type: string
        balanceMinor:
          type: integer
          format: int64
        status:
          type: string
          enum: [active, locked, closed]
      required:
        - id
        - currency
        - balanceMinor
        - status
    CurrentAccount:
      type: object
      properties:
        userId:
          type: string
        phone:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        countryCode:
          type: ["string", "null"]
        wallet:
          $ref: "#/components/schemas/WalletSummary"
      required:
        - userId
        - wallet
    CustomerTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [deposit, inter-network, international]
        status:
          type: string
          enum: [pending, succeeded, failed]
        fromOperator:
          type: ["string", "null"]
        toOperator:
          type: ["string", "null"]
        senderPhone:
          type: string
          minLength: 1
          maxLength: 32
        recipientPhone:
          type: string
          minLength: 1
          maxLength: 32
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: "^[A-Z]{3}$"
        amountMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        feeMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        reference:
          type: string
          minLength: 1
          maxLength: 64
        providerReference:
          type: ["string", "null"]
          maxLength: 128
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - status
        - fromOperator
        - toOperator
        - senderPhone
        - recipientPhone
        - currency
        - amountMinor
        - feeMinor
        - reference
        - providerReference
        - createdAt
    CustomerTransactionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerTransaction"
        nextCursor:
          type: ["string", "null"]
          maxLength: 64
      required: [items, nextCursor]
    IdentityVerificationStatus:
      type: string
      enum: [unverified, pending, review, verified, failed]
    IdentityVerificationSessionRequest:
      type: object
      properties:
        sandboxScenario:
          type: string
          enum: [approve, decline_aml_hit]
          description: Sandbox-only Didit scenario for development tests.
    IdentityVerificationSessionResult:
      type: object
      properties:
        sessionId:
          type: string
        verificationUrl:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/IdentityVerificationStatus"
        diditStatus:
          type: string
        sandboxScenario:
          type: ["string", "null"]
        reused:
          type: boolean
      required: [sessionId, verificationUrl, status, diditStatus, sandboxScenario, reused]
    IdentityVerificationStatusResult:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/IdentityVerificationStatus"
        diditStatus:
          type: ["string", "null"]
        sessionId:
          type: ["string", "null"]
        verificationUrl:
          type: ["string", "null"]
          format: uri
        sandboxScenario:
          type: ["string", "null"]
      required: [status, diditStatus, sessionId, verificationUrl, sandboxScenario]
    AccountLimitResult:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/IdentityVerificationStatus"
        currency:
          type: string
          enum: [XOF]
        monthlyLimit:
          type: integer
          minimum: 1
        sentAmount:
          type: integer
          minimum: 0
        remainingAmount:
          type: integer
          minimum: 0
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
      required: [status, currency, monthlyLimit, sentAmount, remainingAmount, periodStart, periodEnd]
    AdminPeriod:
      type: object
      properties:
        from:
          type: ["string", "null"]
          format: date
        to:
          type: ["string", "null"]
          format: date
      required: [from, to]
    AdminUserSummary:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        countryCode:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, suspended, deleted]
        suspendedAt:
          type: ["string", "null"]
          format: date-time
        deletedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: ["string", "null"]
          format: date-time
        wallet:
          $ref: "#/components/schemas/AdminWalletSummary"
      required: [id, displayName, phone, countryCode, status, suspendedAt, deletedAt, createdAt, lastSeenAt, wallet]
    AdminUserProfile:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        countryCode:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, suspended, deleted]
        suspendedAt:
          type: ["string", "null"]
          format: date-time
        deletedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: ["string", "null"]
          format: date-time
      required: [id, displayName, phone, countryCode, status, suspendedAt, deletedAt, createdAt, updatedAt, lastSeenAt]
    AdminWalletDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currency:
          type: string
