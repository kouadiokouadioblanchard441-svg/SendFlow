    DatabaseStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy]
      required:
        - status
    WalletSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currency:
          type: string
        balanceMinor:
          type: integer
          format: int64
        status:
          type: string
          enum: [active, locked, closed]
      required:
        - id
        - currency
        - balanceMinor
        - status
    CurrentAccount:
