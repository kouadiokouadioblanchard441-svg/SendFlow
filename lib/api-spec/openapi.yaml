    DiditWebhookPayload:
      type: object
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 255
        session_id:
          type: string
          minLength: 1
          maxLength: 255
        webhook_type:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
      required: [event_id, session_id, webhook_type, status]
    WebhookReceipt:
      type: object
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
      required: [received, duplicate]
    AdminWalletAdjustmentRequest:
      type: object
      properties:
        direction:
          type: string
          enum: [credit, debit]
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 10
          maxLength: 500
          pattern: '^(\s*\S){10,}\s*$'
        confirmation:
          type: string
          enum: [CREDIT, DEBIT]
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
        expectedBalanceMinor:
          type: integer
          format: int64
          minimum: 0
      required: [direction, amountMinor, reason, confirmation, idempotencyKey, expectedBalanceMinor]
    AdminUserActionRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          pattern: '^(\s*\S){10,}\s*$'
        confirmation:
          type: string
          enum: [CONFIRMER]
      required: [reason, confirmation]
    AdminWalletAdjustmentResult:
      type: object
      properties:
        ledgerEntryId:
          type: string
          format: uuid
        userId:
          type: string
        walletId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [credit, debit]
        amountMinor:
          type: integer
          format: int64
        balanceBeforeMinor:
          type: integer
          format: int64
        balanceAfterMinor:
          type: integer
          format: int64
        currency:
          type: string
        duplicate:
          type: boolean
      required: [ledgerEntryId, userId, walletId, direction, amountMinor, balanceBeforeMinor, balanceAfterMinor, currency, duplicate]
    AdminActionResult:
      type: object
      properties:
        resourceId:
          type: string
        action:
          type: string
          enum: [suspend_user, restore_user, delete_user, archive_transaction]
        status:
          type: string
          enum: [active, suspended, deleted, archived]
      required: [resourceId, action, status]
    AdminAccessStatus:
      type: object
      properties:
        isAdmin:
          type: boolean
        pinUnlocked:
          type: boolean
      required: [isAdmin, pinUnlocked]
    AdminPinInput:
      type: object
      properties:
        pin:
          type: string
          minLength: 8
          maxLength: 8
          pattern: "^[0-9]{8}$"
      required: [pin]
    AdminPinUnlockResponse:
      type: object
      properties:
        pinUnlocked:
          type: boolean
        expiresAt:
          type: string
          format: date-time
      required: [pinUnlocked, expiresAt]

