                $ref: "#/components/schemas/ErrorEnvelope"
  /public/payment-links/{token}/attempts:
    post:
      operationId: startPublicPaymentLinkAttempt
      tags: [payment-links]
      summary: Start a server-owned FeexPay payment attempt for an active public link
      description: Starts only when LinkFlow payment execution is explicitly enabled by the server. The provider dispatch is persisted before the external request; browser data cannot set a final state.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPaymentLinkAttemptInput"
      responses:
        "200":
          description: Existing idempotent attempt or newly started attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentLinkAttemptCreated"
        "400":
          description: Invalid payer details or unsupported country/operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The payment link is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The idempotency key conflicts or another payment is unresolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Public payment rate limit exceeded.
        "503":
          description: Payment execution is disabled or its dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /public/payment-link-attempts/{attemptId}:
    get:
      operationId: getPublicPaymentLinkAttemptStatus
