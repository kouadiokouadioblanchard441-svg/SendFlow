              $ref: "#/components/schemas/CustomerPaymentLinkUpdate"
      responses:
        "200":
          description: The updated payment link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPaymentLink"
        "400":
          description: Link changes are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: PIN verification is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The link does not exist or does not belong to the customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The link can no longer be edited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
