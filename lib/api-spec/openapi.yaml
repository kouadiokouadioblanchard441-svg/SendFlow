components:
  parameters:
    AdminFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive UTC calendar date.
    AdminTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive UTC calendar date.
    AdminSearch:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    AdminPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    AdminPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    AdminUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AdminUserIdFilter:
      name: userId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    AdminUserIdRequiredFilter:
      name: userId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    AdminTransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminOtpPolicyCountryCode:
      name: countryCode
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 2
        pattern: "^[a-z]{2}$"
    AdminOtpPolicyOperatorId:
      name: operatorId
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 40
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    AdminBannerId:
      name: bannerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminOperatorId:
      name: operatorId
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 60
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    AdminOperatorLogoVersion:
      name: expectedVersion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    sendFlowSession:
      type: apiKey
      in: cookie
      name: __Host-sendflow_session
    sendFlowApiSecret:
      type: http
      scheme: bearer
      bearerFormat: SendFlow secret API key
  schemas:
    AutomaticIpBlock:
      type: object
      required: [id, ipAddress, blockedAt, banCount, rule, version, active, trusted]
      properties:
        id: { type: string, format: uuid }
        ipAddress: { type: string }
        blockedAt: { type: [string, "null"], format: date-time }
        banCount: { type: integer }
        active: { type: boolean }
        trusted: { type: boolean }
        rule: { type: [string, "null"] }
        version: { type: integer }
    NetworkException:
      type: object
      required: [id, ipAddress, reason, createdBy, createdAt, revokedAt, version]
      properties:
        id: { type: string, format: uuid }
        ipAddress: { type: string }
        reason: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        version: { type: integer }
    NetworkDefensePolicy:
      type: object
      required: [requestsPerMinute, probesPerTenMinutes, automaticBlocksPermanent]
      properties:
        requestsPerMinute: { type: integer }
        probesPerTenMinutes: { type: integer }
        automaticBlocksPermanent: { type: boolean, enum: [true] }
    NetworkDefenseStatus:
      type: object
      required: [blocks, exceptions, policy, requesterIp]
      properties:
        blocks:
          type: array
          items: { $ref: "#/components/schemas/AutomaticIpBlock" }
        exceptions:
          type: array
          items: { $ref: "#/components/schemas/NetworkException" }
        policy:
          $ref: "#/components/schemas/NetworkDefensePolicy"
        requesterIp: { type: [string, "null"] }
    AdminIpAuthorizationResult:
      type: object
      required: [ipAddress, manualBlocksReleased, automaticBlockReleased, exception]
      properties:
        ipAddress: { type: string }
        manualBlocksReleased: { type: integer }
        automaticBlockReleased: { type: boolean }
        exception:
          $ref: "#/components/schemas/NetworkException"
    IpBlockInput:
      type: object
      additionalProperties: false
      required: [ipAddress, reason]
      properties:
        ipAddress: { type: string, minLength: 2, maxLength: 45 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    IpBlockRevocation:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483646 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    IpBlock:
      type: object
      required: [id, ipAddress, reason, blockedBy, blockedAt, revokedBy, revokedAt, version]
      properties:
        id: { type: string, format: uuid }
        ipAddress: { type: string }
        reason: { type: string }
        blockedBy: { type: string }
        blockedAt: { type: string, format: date-time }
        revokedBy: { type: [string, "null"] }
        revokedAt: { type: [string, "null"], format: date-time }
        version: { type: integer }
    IpBlockList:
      type: object
      required: [items, page, pageSize, hasMore, requesterIp]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IpBlock"
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }
        requesterIp: { type: [string, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CustomerPortalEligibilityResult:
      type: object
      properties:
        isAuthorized:
          type: boolean
      required:
        - isAuthorized
    EmailOtpSendInput:
      oneOf:
        - type: object
          properties:
            email:
              type: string
              format: email
              maxLength: 254
              description: Email associated with the active SendFlow account.
            turnstileToken:
              type: string
              minLength: 1
              maxLength: 2048
              description: Single-use Cloudflare Turnstile token for password recovery.
            purpose:
              type: string
              enum: [password_reset]
          required: [email, purpose, turnstileToken]
        - type: object
          properties:
            phone:
              type: string
              format: phone
              minLength: 9
              maxLength: 16
              pattern: "^\\+[1-9][0-9]{7,14}$"
              description: Account phone identifier. For signup, this is associated with the new account but is not verified by the email code.
            email:
              type: string
              format: email
              maxLength: 254
              description: Required for signup.
            turnstileToken:
              type: string
              minLength: 1
              maxLength: 2048
              description: Single-use Cloudflare Turnstile token for signup.
            purpose:
              type: string
              enum: [signup]
          required: [phone, email, purpose, turnstileToken]
        - type: object
          properties:
            phone:
              type: string
