      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, minLength: 8, maxLength: 128 }
    post:
      operationId: retryAdminEmailCampaignRecipient
      tags: [admin]
      summary: Queue an explicit, bounded retry for a failed recipient
      description: Only a failed recipient that is still active, verified, opted in, and not unsubscribed can be retried. In-flight and provider-accepted deliveries are never retried.
      security:
        - sendFlowSession: []
      responses:
        "200":
          description: Retry queued or a prior request with the same idempotency key replayed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEmailCampaignRetryResponse" }
        "400":
          description: Idempotency key is invalid.
        "401":
          description: Administrator authentication is required.
        "403":
          description: Administrator mutation access is required.
        "404":
          description: Campaign or recipient was not found.
        "409":
          description: Recipient is no longer retryable, is not eligible, or has reached the manual retry limit.
        "503":
          description: Retry could not be recorded.
        "429":
          description: Administrator retry limit reached.
