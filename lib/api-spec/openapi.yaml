      summary: Refresh a payer's server-owned payment-attempt status
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-LinkFlow-Attempt-Token
          in: header
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "200":
          description: Server-confirmed waiting, uncertain, success, or failure state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentLinkAttemptStatus"
        "404":
          description: The attempt or its bearer token is invalid.
        "429":
          description: Public payment-status rate limit exceeded.
        "503":
          description: The status could not be verified; no final result is inferred.
          content:
            application/json:
